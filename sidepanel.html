<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Llama Browser</title>
    <style>
      :root {
        --bg: #0f1117;
        --surface: #171a23;
        --surface-2: #1f2430;
        --border: #2a3040;
        --text: #e6e9f0;
        --muted: #8b94a8;
        --accent: #38bdf8;
        --accent-hover: #0ea5e9;
        --user-bg: #1e293b;
        --code-bg: #0b0d12;
        --danger: #f87171;
        --ok: #34d399;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        font-size: 13.5px;
        line-height: 1.5;
      }

      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* Top Header */
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        flex-shrink: 0;
      }
      .status-dot.online { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
      .status-dot.offline { background: var(--danger); }

      select {
        flex: 1;
        min-width: 0;
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 8px;
        font-size: 12.5px;
        outline: none;
        cursor: pointer;
      }
      select:focus { border-color: var(--accent); }

      .icon-btn {
        background: var(--surface-2);
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 9px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .icon-btn:hover { color: var(--text); border-color: var(--accent); }

      /* Chat Feed */
      #chatFeed {
        flex: 1;
        overflow-y: auto;
        padding: 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #chatFeed::-webkit-scrollbar { width: 6px; }
      #chatFeed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

      .empty-state {
        margin: auto;
        text-align: center;
        color: var(--muted);
        max-width: 240px;
      }
      .empty-state h3 {
        margin: 0 0 6px;
        font-size: 15px;
        color: var(--text);
        font-weight: 600;
      }
      .empty-state p { margin: 0; font-size: 12.5px; }

      .msg {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 94%;
        animation: fadeIn 0.12s ease;
      }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

      .msg.user { align-self: flex-end; }
      .msg.assistant { align-self: flex-start; width: 100%; }

      .msg-meta {
        font-size: 11px;
        color: var(--muted);
        padding: 0 4px;
      }
      .msg.user .msg-meta { text-align: right; }

      .bubble {
        padding: 9px 12px;
        border-radius: 12px;
        word-wrap: break-word;
      }

      .msg.user .bubble {
        background: var(--user-bg);
        border: 1px solid #2d3d56;
        border-bottom-right-radius: 4px;
        white-space: pre-wrap;
      }

      .msg.assistant .bubble {
        background: var(--surface);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }

      /* Markdown & Code Styling */
      .bubble p { margin: 0 0 8px; }
      .bubble p:last-child { margin-bottom: 0; }
      .bubble code.inline {
        background: var(--code-bg);
        border: 1px solid var(--border);
        padding: 1px 5px;
        border-radius: 5px;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 12px;
        color: #7dd3fc;
      }

      .code-wrap {
        margin: 8px 0;
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .code-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 10px;
        background: #131620;
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        color: var(--muted);
      }
      .copy-btn {
        background: transparent;
        border: none;
        color: var(--accent);
        cursor: pointer;
        font-size: 11px;
        padding: 2px 4px;
      }
      .copy-btn:hover { text-decoration: underline; }
      .code-wrap pre {
        margin: 0;
        padding: 10px;
        overflow-x: auto;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 12px;
        line-height: 1.45;
        color: #e2e8f0;
      }

      /* Composer Footer */
      footer {
        padding: 10px 12px 12px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .context-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11.5px;
        color: var(--muted);
      }

      .pill-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--muted);
        cursor: pointer;
        user-select: none;
        font-size: 11.5px;
      }
      .pill-toggle.active {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(56, 189, 248, 0.1);
      }

      .input-box {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 6px 8px;
      }
      .input-box:focus-within { border-color: var(--accent); }

      textarea {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
        line-height: 1.4;
        resize: none;
        max-height: 140px;
        min-height: 22px;
        padding: 3px 2px;
        outline: none;
      }

      #sendBtn {
        background: var(--accent);
        color: #081018;
        border: none;
        border-radius: 8px;
        padding: 6px 12px;
        font-weight: 600;
        font-size: 12.5px;
        cursor: pointer;
        flex-shrink: 0;
      }
      #sendBtn:hover { background: var(--accent-hover); }
      #sendBtn.stop { background: var(--danger); color: #190808; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <span id="statusDot" class="status-dot" title="Ollama connection status"></span>
        <select id="modelSelect" title="Select local model"></select>
        <button id="refreshBtn" class="icon-btn" type="button" title="Refresh models">↻</button>
        <button id="clearBtn" class="icon-btn" type="button" title="Clear chat">Clear</button>
      </header>

      <main id="chatFeed">
        <div id="emptyState" class="empty-state">
          <h3>Local Qwen Ready</h3>
          <p>Ask anything, paste code, or toggle <strong>Page Context</strong> to discuss the active tab.</p>
        </div>
      </main>

      <footer>
        <div class="context-bar">
          <button id="pageCtxBtn" class="pill-toggle" type="button">+ Page Context</button>
          <span>Enter to send · Shift+Enter newline</span>
        </div>
        <div class="input-box">
          <textarea id="promptInput" rows="1" placeholder="Message Qwen..."></textarea>
          <button id="sendBtn" type="button">Send</button>
        </div>
      </footer>
    </div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
